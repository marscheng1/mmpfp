[project]
name = "mmpfp"
version = "0.1.0"
description = "刷题记录追踪与解题日志服务"
readme = "README.md"
requires-python = ">=3.11, <3.15"
dependencies = [
    "fastapi",
    "fastapi-mcp>=0.4.0,<0.5.0",
    "mcp>=1.12.0,<1.14.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
desktop = [
    "pywebview>=6.2.1,<7; sys_platform == 'win32'",
    "pystray>=0.19.5,<1; sys_platform == 'win32'",
    "pillow>=11,<13; sys_platform == 'win32'",
    "pythonnet>=3.1,<4; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
