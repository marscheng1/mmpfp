[project]
name = "mmpfp"
version = "0.1.0"
description = "刷题记录追踪与 MCP 解题知识库服务"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.0",
    "fastapi-mcp>=0.1.0",
    "mcp>=1.12.0,<1.14.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
